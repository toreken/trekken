name: Keep Render Alive

on:
  schedule:
    # 14分ごとに実行（Renderのスリープ閾値は15分なので、それより短く）
    - cron: '*/14 * * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping trekken.onrender.com
        run: |
          echo "Pinging trekken.onrender.com..."
          # 最大3回リトライ、各60秒タイムアウト
          for i in 1 2 3; do
            response=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 https://trekken.onrender.com/)
            echo "Attempt $i: HTTP $response"
            if [ "$response" = "200" ]; then
              echo "✅ Site is alive"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done
          echo "::warning::Site returned non-200 after 3 attempts"
          # 失敗してもワークフロー全体は失敗にしない（次の実行に賭ける）
          exit 0
