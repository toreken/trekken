name: Keep Render Alive

on:
  schedule:
    # 10分ごとに実行（cronの遅延を見越して14分→10分に短縮）
    # GitHub Actionsのcronは遅延しやすく、15分スリープに間に合わないケースがあるため
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping trekken.onrender.com
        run: |
          echo "Pinging trekken.onrender.com/ping..."
          # コールドスタート時はサーバー起動に60〜90秒かかるため、タイムアウトを180秒に延長
          # 最大3回リトライ、リトライ間隔30秒（前回の起動完了を待つ）
          for i in 1 2 3; do
            response=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 180 \
              -H "User-Agent: GitHub-Actions-Keepalive" \
              https://trekken.onrender.com/ping)
            echo "Attempt $i: HTTP $response"
            if [ "$response" = "200" ]; then
              echo "✅ Site is alive"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done
          echo "::warning::Site returned non-200 after 3 attempts"
          exit 0
